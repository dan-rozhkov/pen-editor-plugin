name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Toolchain versions only — Vitest requires Node >= 20, which is
        # stricter than the plugin's own runtime floor. The floor is covered
        # by the `runtime-floor` job below.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Manifest conformance only: no subprocesses, no sockets. Split out so a
      # spec violation in plugin.json/mcp.json is legible on its own.
      - name: Validate plugin manifests
        run: npm run validate

      # Full suite, including the e2e tests that spawn the real proxy binary
      # and bind loopback ports.
      - name: Test
        run: npm test

  runtime-floor:
    # package.json declares engines >= 18 because the proxy needs global
    # fetch. Vitest cannot run there, so instead drive the real binary with
    # plain node and assert it answers rather than hangs. A client launching
    # the plugin on Node 18 must not get a silent hang.
    name: Proxy runs on the declared minimum (Node 18)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Answers a request with no token configured
        env:
          PEN_EDITOR_MCP_URL: http://127.0.0.1:1/api/mcp
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out=$(printf '%s\n' "$request" | timeout 30 node bin/pen-editor-mcp.mjs 2>/dev/null)
          echo "$out"
          # -32001 is the "no auth token configured" error. Reaching it proves
          # the module loaded, stdin was parsed and the request was answered.
          echo "$out" | grep -q '"code":-32001'
